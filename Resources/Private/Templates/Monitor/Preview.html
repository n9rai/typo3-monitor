<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">
    <h1>Datenvorschau</h1>
    <p>
        Genau diese Daten sendet der Monitor (hier nicht gesendet, nur angezeigt, {bytes} Bytes).
        Es sind ausschließlich Versionen, Zahlen und Flags &ndash; keine Benutzernamen, E-Mails, IPs oder Inhalte.
    </p>
    <p><a href="{uris.index}" class="btn btn-default btn-secondary">&larr; Zurück</a></p>
    <pre class="border rounded p-3" style="max-height:70vh;overflow:auto;">{json}</pre>
</f:section>

</html>
